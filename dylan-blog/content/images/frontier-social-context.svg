<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Social reasoning accuracy by context</title><desc id="d">Accuracy rises as more social context is provided</desc><rect width="900" height="420" rx="24" fill="#0b171a"/><text x="55" y="55" fill="#e9f6f3" font-family="system-ui" font-size="24" font-weight="700">Context changes social inference more than confidence does</text><g stroke="#294542"><path d="M90 100V335H835"/><path d="M90 275H835M90 215H835M90 155H835"/></g><path d="M150 269 L350 221 L550 176 L750 146" fill="none" stroke="#65f0c4" stroke-width="6"/><g fill="#65f0c4"><circle cx="150" cy="269" r="9"/><circle cx="350" cy="221" r="9"/><circle cx="550" cy="176" r="9"/><circle cx="750" cy="146" r="9"/></g><g fill="#e9f6f3" font-family="monospace" font-size="15" text-anchor="middle"><text x="150" y="250">52%</text><text x="350" y="202">68%</text><text x="550" y="157">79%</text><text x="750" y="127">84%</text><text x="150" y="365">none</text><text x="350" y="365">minimal</text><text x="550" y="365">full</text><text x="750" y="365">history</text></g><text x="55" y="400" fill="#94aaa6" font-family="system-ui" font-size="14">Recorded social intelligence evaluation.</text></svg>
