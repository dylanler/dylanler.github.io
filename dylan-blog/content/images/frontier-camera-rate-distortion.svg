<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Camera annotation rate distortion curve</title><desc id="d">Angular error falls as bits per camera pose increase</desc><rect width="900" height="460" rx="24" fill="#0b171a"/><text x="55" y="52" fill="#e9f6f3" font-family="system-ui" font-size="24" font-weight="700">Camera labels have a measurable rate distortion curve</text><text x="55" y="82" fill="#94aaa6" font-family="system-ui" font-size="14">More representational bits preserve more of the generating pose</text><g stroke="#294542" stroke-width="1"><path d="M105 110V375H835"/><path d="M105 155H835M105 220H835M105 285H835M105 350H835"/></g><path d="M250 145 C470 155 580 305 690 338 S760 352 790 352" fill="none" stroke="#65f0c4" stroke-width="5"/><g fill="#65f0c4" stroke="#0b171a" stroke-width="4"><circle cx="250" cy="145" r="11"/><circle cx="690" cy="338" r="11"/><circle cx="790" cy="352" r="11"/></g><g fill="#e9f6f3" font-family="monospace" font-size="14"><text x="195" y="128">vague 9.03°</text><text x="615" y="318">integer 0.424°</text><text x="720" y="390">half degree 0°</text><text x="220" y="420">3.17 bits</text><text x="650" y="420">11.95</text><text x="760" y="420">13.93</text></g><text x="55" y="440" fill="#94aaa6" font-family="system-ui" font-size="13">15,617 poses on a deterministic half degree grid. Mean Euclidean angular error.</text></svg>
