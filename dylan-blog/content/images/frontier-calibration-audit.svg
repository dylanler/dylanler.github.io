<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Calibration audit by model</title><desc id="d">Brier score and expected calibration error for three models</desc><rect width="900" height="460" rx="24" fill="#0b171a"/><text x="55" y="52" fill="#e9f6f3" font-family="system-ui" font-size="24" font-weight="700">Accuracy and calibration disagree</text><text x="55" y="82" fill="#94aaa6" font-family="system-ui" font-size="14">Lower is better for Brier score and expected calibration error</text><g font-family="monospace" font-size="15"><text x="55" y="160" fill="#e9f6f3">Claude Opus 4.5</text><rect x="240" y="130" width="235" height="22" rx="6" fill="#65f0c4"/><rect x="240" y="159" width="281" height="22" rx="6" fill="#a98cff"/><text x="535" y="165" fill="#fff">0.188 / 0.225</text><text x="55" y="255" fill="#e9f6f3">GPT 5.2 Thinking</text><rect x="240" y="225" width="300" height="22" rx="6" fill="#65f0c4"/><rect x="240" y="254" width="304" height="22" rx="6" fill="#a98cff"/><text x="558" y="260" fill="#fff">0.240 / 0.243</text><text x="55" y="350" fill="#e9f6f3">Gemini 3 Pro</text><rect x="240" y="320" width="388" height="22" rx="6" fill="#65f0c4"/><rect x="240" y="349" width="401" height="22" rx="6" fill="#a98cff"/><text x="655" y="355" fill="#fff">0.310 / 0.321</text></g><g font-family="system-ui" font-size="13"><rect x="55" y="405" width="14" height="14" rx="3" fill="#65f0c4"/><text x="78" y="417" fill="#94aaa6">Brier</text><rect x="145" y="405" width="14" height="14" rx="3" fill="#a98cff"/><text x="168" y="417" fill="#94aaa6">ECE</text><text x="290" y="417" fill="#94aaa6">48 scorable of 72 valid rows, with 18 API failures excluded</text></g></svg>
