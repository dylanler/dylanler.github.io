<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Latent memory quality and hallucination tradeoff</title><desc id="d">Latent memory improves F1 and latency but increases hallucination</desc><rect width="900" height="420" rx="24" fill="#0b171a"/><text x="55" y="55" fill="#e9f6f3" font-family="system-ui" font-size="24" font-weight="700">The faster memory also hallucinates more</text><g font-family="monospace" font-size="15"><text x="55" y="145" fill="#94aaa6">F1</text><rect x="165" y="118" width="182" height="28" rx="7" fill="#ffb86b"/><rect x="165" y="151" width="257" height="28" rx="7" fill="#65f0c4"/><text x="440" y="171" fill="#fff">+41.5%</text><text x="55" y="245" fill="#94aaa6">Latency</text><rect x="165" y="218" width="489" height="28" rx="7" fill="#ffb86b"/><rect x="165" y="251" width="191" height="28" rx="7" fill="#65f0c4"/><text x="675" y="240" fill="#fff">19.55 s</text><text x="370" y="273" fill="#fff">7.65 s</text><text x="55" y="345" fill="#94aaa6">Hallucination</text><rect x="165" y="318" width="292" height="28" rx="7" fill="#ffb86b"/><rect x="165" y="351" width="580" height="28" rx="7" fill="#ff5d6c"/></g><g font-family="system-ui" font-size="13"><text x="765" y="340" fill="#ff826e">Text buffer</text><text x="765" y="370" fill="#65f0c4">Latent pager</text></g><text x="55" y="405" fill="#94aaa6" font-family="system-ui" font-size="14">500 test examples. Paired bootstrap p less than 0.001.</text></svg>
