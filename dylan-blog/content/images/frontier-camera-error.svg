<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Camera label reconstruction error</title><desc id="d">Bar chart comparing vague labels with coordinate labels for pan and tilt error</desc><rect width="900" height="420" rx="24" fill="#0b171a"/><text x="55" y="55" fill="#e9f6f3" font-family="system-ui" font-size="24" font-weight="700">Reconstruction error falls when language contains coordinates</text><text x="55" y="86" fill="#94aaa6" font-family="system-ui" font-size="15">Mean absolute angular error across 15,617 synthetic poses</text><g font-family="monospace" font-size="16"><text x="55" y="160" fill="#94aaa6">Vague pan</text><rect x="190" y="137" width="565" height="32" rx="8" fill="#ff826e"/><text x="770" y="160" fill="#fff">7.20°</text><text x="55" y="215" fill="#94aaa6">Vague tilt</text><rect x="190" y="192" width="337" height="32" rx="8" fill="#ffb86b"/><text x="542" y="215" fill="#fff">4.29°</text><text x="55" y="285" fill="#94aaa6">Precise pan</text><rect x="190" y="262" width="20" height="32" rx="8" fill="#65f0c4"/><text x="225" y="285" fill="#fff">0.25°</text><text x="55" y="340" fill="#94aaa6">Precise tilt</text><rect x="190" y="317" width="19" height="32" rx="8" fill="#65f0c4"/><text x="225" y="340" fill="#fff">0.25°</text></g><text x="55" y="390" fill="#65f0c4" font-family="system-ui" font-size="14">Deterministic grid experiment. Lower is better.</text></svg>
