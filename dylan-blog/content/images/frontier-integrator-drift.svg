<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Energy drift by numerical integrator</title><desc id="d">Velocity Verlet preserves oscillator energy much better than Euler methods</desc><rect width="900" height="460" rx="24" fill="#0b171a"/><text x="55" y="52" fill="#e9f6f3" font-family="system-ui" font-size="24" font-weight="700">The same generated law can create three different worlds</text><text x="55" y="82" fill="#94aaa6" font-family="system-ui" font-size="14">Maximum relative energy drift over 20 seconds at dt = 0.1</text><g font-family="monospace" font-size="15"><text x="55" y="160" fill="#94aaa6">Explicit Euler</text><rect x="220" y="132" width="570" height="34" rx="8" fill="#ff5d6c"/><text x="805" y="157" fill="#fff">631.60%</text><text x="55" y="245" fill="#94aaa6">Semi implicit</text><rect x="220" y="217" width="180" height="34" rx="8" fill="#ffb86b"/><text x="415" y="242" fill="#fff">5.26%</text><text x="55" y="330" fill="#94aaa6">Velocity Verlet</text><rect x="220" y="302" width="70" height="34" rx="8" fill="#65f0c4"/><text x="305" y="327" fill="#fff">0.25%</text></g><text x="55" y="410" fill="#94aaa6" font-family="system-ui" font-size="14">Harmonic oscillator x double prime = negative x. One hundred percent means energy changed by its initial value.</text><text x="55" y="435" fill="#65f0c4" font-family="system-ui" font-size="13">Standard library reproduction in frontier_technical_audit.py</text></svg>
