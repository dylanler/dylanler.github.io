<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Uncertainty by question category</title><desc id="d">Agreement falls and entropy rises from factual to ethical questions</desc><rect width="900" height="420" rx="24" fill="#0b171a"/><text x="55" y="55" fill="#e9f6f3" font-family="system-ui" font-size="24" font-weight="700">Disagreement can be an instrument</text><g stroke="#294542"><path d="M90 105V330H840"/><path d="M90 180H840M90 255H840"/></g><polyline points="150,135 310,135 470,165 630,195 790,245" fill="none" stroke="#65f0c4" stroke-width="6"/><polyline points="150,290 310,290 470,248 630,220 790,180" fill="none" stroke="#a98cff" stroke-width="6"/><g fill="#e9f6f3" font-family="monospace" font-size="14" text-anchor="middle"><text x="150" y="355">factual</text><text x="310" y="355">ambiguous</text><text x="470" y="355">aesthetic</text><text x="630" y="355">predictive</text><text x="790" y="355">ethical</text></g><text x="645" y="105" fill="#65f0c4" font-family="monospace">agreement</text><text x="645" y="130" fill="#a98cff" font-family="monospace">entropy</text><text x="55" y="400" fill="#94aaa6" font-family="system-ui" font-size="14">Three samples per question from the recorded Claude Opus 4.5 run.</text></svg>
